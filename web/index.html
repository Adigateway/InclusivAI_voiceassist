<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caritas Wegweiser</title>
<style>
  :root {
    --red: #c8102e; --bg: #f6f5f3; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e4e2de; --user: #c8102e; --user-text: #fff; --bot: #ffffff; --alert: #fff1f2; --alert-line: #f3b4bd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --panel: #1f1f22; --text: #f2f2f4; --muted: #a0a0a8; --line: #333338;
            --bot: #26262a; --alert: #3a1d22; --alert-line: #7a2e3a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { max-width: 720px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .logo { width: 34px; height: 34px; border-radius: 8px; background: var(--red); color: #fff;
          display: grid; place-items: center; font-weight: 700; font-size: 20px; }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  #reset { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--muted);
           border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .crisis { background: var(--alert); border-color: var(--alert-line); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--red); margin-bottom: 4px; }
  .office { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
            background: var(--panel); white-space: normal; }
  .office b { display: block; }
  .office div { color: var(--muted); font-size: 14px; }
  .office a { color: var(--red); }
  .typing { color: var(--muted); font-style: italic; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { border: 1px solid var(--line); background: var(--panel); color: var(--text);
                     border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
  #input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); font: inherit; }
  #send { padding: 0 18px; border: 0; border-radius: 12px; background: var(--red); color: #fff;
          font: inherit; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  footer { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">+</div>
    <div>
      <h1>Caritas Wegweiser</h1>
      <p>Beschreiben Sie Ihre Situation in eigenen Worten.</p>
    </div>
    <button id="reset" title="Neues Gespräch">Neu starten</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Wobei brauchen Sie Hilfe?" aria-label="Nachricht">
    <button id="send" type="submit">Senden</button>
  </form>
  <footer>Prototyp, kein offizielles Angebot der Caritas. Im Notfall: 112 · TelefonSeelsorge 0800 111 0 111</footer>
</div>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
let session = crypto.randomUUID();

const EXAMPLES = [
  "Ich habe so viele Schulden und weiß nicht weiter",
  "Mein Sohn ist 15 und kifft jeden Tag",
  "Ich bin schwanger und habe kein Geld",
  "I came from Ukraine and need help with papers",
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function scroll() { chat.scrollTop = chat.scrollHeight; }

function welcome() {
  chat.innerHTML = "";
  const m = el("div", "msg bot",
    "Hallo! Ich helfe Ihnen, die passende Caritas-Beratung in Unterfranken zu finden. Erzählen Sie mir einfach, was los ist.\n\nHello! You can also write in English or another language.");
  chat.append(m);
  const ex = el("div", "examples");
  for (const t of EXAMPLES) {
    const b = el("button", null, t);
    b.type = "button";
    b.onclick = () => { ex.remove(); ask(t); };
    ex.append(b);
  }
  chat.append(ex);
}

function officeCard(o) {
  const c = el("div", "office");
  c.append(el("b", null, o.organisation));
  if (!o.street.startsWith("siehe")) c.append(el("div", null, `${o.street}, ${o.plz} ${o.city}`));
  const contact = el("div");
  const tel = el("a", null, o.phone);
  tel.href = "tel:" + o.phone.replace(/[^\d+]/g, "");
  contact.append("Tel. ", tel);
  if (o.email) {
    const mail = el("a", null, o.email.split(";")[0]);
    mail.href = "mailto:" + o.email.split(";")[0].trim();
    contact.append(" · ", mail);
  }
  c.append(contact);
  if (o.website) {
    const w = el("a", null, "Website");
    w.href = o.website.split(";")[0].trim(); w.target = "_blank"; w.rel = "noopener";
    const d = el("div"); d.append(w); c.append(d);
  }
  return c;
}

function botMessage(r) {
  const m = el("div", "msg bot" + (r.kind === "crisis" ? " crisis" : ""));
  if (r.kind === "recommend") {
    // text lines without the office bullets; offices are shown as cards
    const lines = r.text.split("\n").filter(l => !l.startsWith("•") && !l.startsWith("  "));
    if (r.region) m.append(el("span", "tag", r.region), document.createElement("br"));
    m.append(lines.join("\n"));
    for (const o of r.offices) m.append(officeCard(o));
  } else {
    m.textContent = r.text;
  }
  return m;
}

async function ask(text) {
  chat.append(el("div", "msg user", text));
  const typing = el("div", "msg bot typing", "…");
  chat.append(typing); scroll();
  send.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session, message: text }),
    });
    const data = await res.json();
    typing.replaceWith(res.ok ? botMessage(data)
      : el("div", "msg bot crisis", "Entschuldigung, gerade gibt es ein technisches Problem. Bitte versuchen Sie es gleich noch einmal.\n(" + data.error + ")"));
  } catch (e) {
    typing.replaceWith(el("div", "msg bot crisis", "Keine Verbindung zum Server."));
  }
  send.disabled = false; input.focus(); scroll();
}

form.onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  document.querySelector(".examples")?.remove();
  ask(text);
};

document.getElementById("reset").onclick = async () => {
  await fetch("/api/reset", { method: "POST", body: JSON.stringify({ session }) });
  session = crypto.randomUUID();
  welcome(); input.focus();
};

welcome();
input.focus();
</script>
</body>
</html>
